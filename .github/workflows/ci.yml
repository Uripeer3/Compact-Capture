name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-gtk-3.0
      - run: npm test
      - run: npm run check
      - run: npm run test:gjs
      - run: bash -n build.sh
